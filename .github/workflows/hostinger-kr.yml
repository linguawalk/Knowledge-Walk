name: Publish kr to Hostinger
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the approved kr site (false checks the connection only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: knowledgewalk-hostinger-kr
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'linguawalk/Knowledge-Walk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build approved domain sites
        run: python3 tools/build_site.py
      - name: Check connection without changing files
        if: ${{ !inputs.publish }}
        env:
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTPS_HOST: ${{ vars.HOSTINGER_FTPS_HOST || '145.79.26.89' }}
        run: python3 tools/deploy_hostinger.py
      - name: Upload approved kr files
        if: ${{ inputs.publish }}
        env:
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTPS_HOST: ${{ vars.HOSTINGER_FTPS_HOST || '145.79.26.89' }}
        run: python3 tools/deploy_hostinger.py --publish
