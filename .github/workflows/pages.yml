name: Validate KnowledgeWalk publication

on:
  push:
    branches: [main]
    paths:
      - 'content/stories/**'
      - 'content/images/**'
      - 'content/illustrations/**'
      - 'config/**'
      - 'site/**'
      - 'tools/build_site.py'
      - 'tests/**'
      - 'tools/daily_generation.py'
      - 'tools/export_review.py'
      - '.github/workflows/pages.yml'
      - '_config.yml'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledgewalk-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'linguawalk/Knowledge-Walk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check content and publication isolation
        run: python3 -m unittest discover -s tests -v
      - name: Build approved stories only
        run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
